openapi: 3.1.0
info:
  title: CallAnchor Portal API
  version: 0.1.0
  description: |
    Internal portal API behind app.360callanchor.com. There is no public contract:
    this file is reverse-documented from captured responses and is the source of
    truth for this repo. CallAnchor can change it without notice, so `ca check`
    compares it against production.

    Extensions:
    - `x-safety`: `read`, `sensitive` (a read that issues access to a recording),
      `write` (changes state, needs --confirm) or `auth` (login flow).
    - `x-verified`: `sample` means the shape comes from one sheet sample and has
      not been checked live. Otherwise it's the date of the first passing `ca check`.
servers:
  - url: https://app.360callanchor.com
tags:
  - name: Auth
  - name: Fleet
  - name: Clients
  - name: Calls
  - name: Sync
  - name: Logs
  - name: OneAPI
  - name: Licenses
  - name: App
security:
  - portalSession: []
paths:
  /api/auth/send-otp:
    post:
      operationId: sendOtp
      tags: [Auth]
      summary: Place an OTP call to a portal user
      description: Calls a real phone each time it runs.
      x-safety: auth
      x-verified: sample
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '200':
          description: OTP call placed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpSent' }
  /api/auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [Auth]
      summary: Exchange an OTP for a portal session
      description: Returns the session as a callanchor_portal_session cookie in Set-Cookie.
      x-safety: auth
      x-verified: sample
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/OtpRequest' }
                - type: object
                  required: [otp]
                  properties:
                    otp: { type: string }
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalUser' }
  /api/portal/profile:
    get:
      operationId: getPortalProfile
      tags: [Auth]
      summary: Who the session belongs to; the session validity check
      description: Returns 200 with a profile for a valid session, and 401 for an invalid or missing one.
      x-safety: read
      x-verified: 2026-11-02
      responses:
        '200':
          description: Valid session
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile: { $ref: '#/components/schemas/PortalProfile' }
        '401':
          description: Invalid or missing session
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
  /api/fleet:
    get:
      operationId: getFleet
      tags: [Fleet]
      summary: Fleet totals and one metrics row per client
      x-safety: read
      x-verified: 2026-11-02
      responses:
        '200':
          description: Fleet summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fleet' }
  /api/clients:
    get:
      operationId: listClients
      tags: [Clients]
      summary: List all clients
      x-safety: read
      x-verified: 2026-11-02
      responses:
        '200':
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Client' }
  /api/clients/{clientId}:
    parameters:
      - $ref: '#/components/parameters/clientId'
    get:
      operationId: getClient
      tags: [Clients]
      summary: One client
      x-safety: read
      x-verified: 2026-11-02
      responses:
        '200':
          description: Client
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
  /api/clients/{clientId}/tenant:
    parameters:
      - $ref: '#/components/parameters/clientId'
    get:
      operationId: getClientTenant
      tags: [Clients]
      summary: Everything about one client
      description: |
        Licenses, integrations, settings and quota counters. Heavy (46 KB in the
        sample). `callRecords` and `callAnchorLogs` are truncated previews, so use
        the paginated endpoints for history.
      x-safety: read
      x-verified: 2026-11-02
      responses:
        '200':
          description: Tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
  /api/clients/{clientId}/integrations:
    parameters:
      - $ref: '#/components/parameters/clientId'
    get:
      operationId: listClientIntegrations
      tags: [Clients]
      summary: Integration configs for a client
      x-safety: read
      x-verified: 2026-11-02
      responses:
        '200':
          description: Integrations
          content:
            application/json:
              schema:
                type: object
                required: [configs, logs]
                properties:
                  configs:
                    type: array
                    items: { $ref: '#/components/schemas/Integration' }
                  logs:
                    type: array
                    items: { $ref: '#/components/schemas/CalloutEvent' }
  /api/clients/{clientId}/disposition-form-fields:
    parameters:
      - $ref: '#/components/parameters/clientId'
    get:
      operationId: getDispositionFormFields
      tags: [Clients]
      summary: Disposition form for a client
      x-safety: read
      x-verified: 2026-11-02
      responses:
        '200':
          description: Form fields and presets
          content:
            application/json:
              schema:
                type: object
                required: [fields, presets]
                properties:
                  fields:
                    type: array
                    items: { $ref: '#/components/schemas/DispositionField' }
                  presets:
                    type: array
                    items: { $ref: '#/components/schemas/DispositionPresetRecord' }
  /api/clients/{clientId}/call-contacts:
    parameters:
      - $ref: '#/components/parameters/clientId'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/limit'
    get:
      operationId: listCallContacts
      tags: [Calls]
      summary: Calls grouped by contact, with call stats
      x-safety: read
      x-verified: 2026-11-02
      x-paginated: true
      responses:
        '200':
          description: Contacts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallContacts' }
  /api/clients/{clientId}/calls/{callId}/recording-link:
    parameters:
      - $ref: '#/components/parameters/clientId'
      - name: callId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getRecordingLink
      tags: [Calls]
      summary: Issue a signed link to a call recording
      description: The link is valid for 5 minutes. Never log or store it.
      x-safety: sensitive
      x-verified: sample
      responses:
        '200':
          description: Signed link
          content:
            application/json:
              schema:
                type: object
                required: [callId, recordingStatus, url, expiresAt]
                properties:
                  callId: { type: string }
                  recordingStatus: { type: string }
                  url: { type: string }
                  expiresAt: { type: string, format: date-time }
  /api/clients/{clientId}/callout-logs:
    parameters:
      - $ref: '#/components/parameters/clientId'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/limit'
    get:
      operationId: listCalloutLogs
      tags: [Sync]
      summary: CRM delivery attempts, with success aggregate
      description: The sample asked for limit=50 and got limit=10, so there may be a server cap.
      x-safety: read
      x-verified: 2026-11-02
      x-paginated: true
      responses:
        '200':
          description: Delivery attempts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalloutLogs' }
  /api/clients/{clientId}/anchor-logs/{requestId}:
    parameters:
      - $ref: '#/components/parameters/clientId'
      - name: requestId
        in: path
        required: true
        description: The `requestId` of a callout event, not its `id`.
        schema: { type: string }
    get:
      operationId: getAnchorLog
      tags: [Sync]
      summary: One delivery request with its attempts
      x-safety: read
      x-verified: 2026-11-02
      responses:
        '200':
          description: Request detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnchorLog' }
  /api/clients/{clientId}/oneapi/status:
    parameters:
      - $ref: '#/components/parameters/clientId'
    get:
      operationId: getOneApiStatus
      tags: [OneAPI]
      summary: Billing and licensing link status
      x-safety: read
      x-verified: 2026-11-02
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OneApiStatus' }
  /api/clients/{clientId}/oneapi/backfill:
    parameters:
      - $ref: '#/components/parameters/clientId'
    post:
      operationId: backfillOneApi
      tags: [OneAPI]
      summary: Refresh a client's OneAPI link and license data
      x-safety: write
      x-verified: sample
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OneApiBackfill' }
  /api/support/logs:
    parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/clientIdFilter'
    get:
      operationId: listSystemLogs
      tags: [Logs]
      summary: System logs, optionally for one client
      x-safety: read
      x-verified: 2026-11-02
      x-paginated: true
      responses:
        '200':
          description: Logs
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SystemLog' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
  /api/support/audit-logs:
    parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/clientIdFilter'
    get:
      operationId: listAuditLogs
      tags: [Logs]
      summary: Audit logs, optionally for one client
      x-safety: read
      x-verified: 2026-11-02
      x-paginated: true
      responses:
        '200':
          description: Logs
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
  /api/support/audit-logs/{auditLogId}:
    parameters:
      - name: auditLogId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getAuditLog
      tags: [Logs]
      summary: One audit log entry
      x-safety: read
      x-verified: 2026-11-05
      responses:
        '200':
          description: Audit log entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLog' }
  /api/auth/me:
    get:
      operationId: getAuthMe
      tags: [Auth]
      summary: The signed-in user, with role, permissions and log access
      description: The portal calls this on every page. Support users see `kind` support.
      x-safety: read
      x-verified: 2026-11-05
      responses:
        '200':
          description: Signed-in user
          content:
            application/json:
              schema:
                type: object
                required: [authenticated, profile]
                properties:
                  authenticated: { type: boolean }
                  profile: { $ref: '#/components/schemas/PortalUser' }
  /api/app-build/latest:
    get:
      operationId: getLatestAppBuild
      tags: [App]
      summary: The active Android app release
      x-safety: read
      x-verified: 2026-11-05
      responses:
        '200':
          description: Latest release
          content:
            application/json:
              schema:
                type: object
                required: [release]
                properties:
                  release: { $ref: '#/components/schemas/AppRelease' }
  /api/clients/{clientId}/onboarding-progress:
    parameters:
      - $ref: '#/components/parameters/clientId'
    get:
      operationId: getOnboardingProgress
      tags: [Clients]
      summary: Onboarding steps a client has completed
      x-safety: read
      x-verified: 2026-11-05
      responses:
        '200':
          description: Progress
          content:
            application/json:
              schema:
                type: object
                required: [steps, welcomeDismissed, portalTourCompleted]
                properties:
                  steps:
                    type: array
                    items:
                      type: object
                      required: [stepKey]
                      properties:
                        stepKey: { type: string, description: 'Seen: mobile_login' }
                        completedAt: { type: [string, 'null'], format: date-time }
                  welcomeDismissed: { type: boolean }
                  portalTourCompleted: { type: boolean }
                  termsAcceptedAt: { type: [string, 'null'] }
  /api/clients/{clientId}/portal-admins:
    parameters:
      - $ref: '#/components/parameters/clientId'
    get:
      operationId: listPortalAdmins
      tags: [Clients]
      summary: A client's customer-portal admins
      x-safety: read
      x-verified: 2026-11-05
      responses:
        '200':
          description: Admins
          content:
            application/json:
              schema:
                type: object
                required: [admins]
                properties:
                  admins:
                    type: array
                    items: { $ref: '#/components/schemas/PortalAdmin' }
  /api/clients/{clientId}/notifications:
    parameters:
      - $ref: '#/components/parameters/clientId'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/limit'
    get:
      operationId: listNotifications
      tags: [Clients]
      summary: A client's portal notifications
      description: The sample was empty, so the shape of a notification is unknown.
      x-safety: read
      x-verified: 2026-11-05
      x-paginated: true
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                required: [notifications, unreadCount, pagination]
                properties:
                  notifications:
                    type: array
                    items: {}
                  unreadCount: { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
  /api/clients/{clientId}/ai-credits:
    parameters:
      - $ref: '#/components/parameters/clientId'
      - name: from
        in: query
        schema: { type: string }
      - name: to
        in: query
        schema: { type: string }
      - name: cursor
        in: query
        description: The previous page's `purchaseChangesNextCursor`.
        schema: { type: string }
      - $ref: '#/components/parameters/limit'
    get:
      operationId: getAiCredits
      tags: [Clients]
      summary: AI credit balance, entitlements and purchase history
      description: The sample had no licenses or purchase changes, so their item shapes are unknown.
      x-safety: read
      x-verified: 2026-11-05
      responses:
        '200':
          description: Credits
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiCredits' }
  /api/clients/{clientId}/disposition-sets:
    parameters:
      - $ref: '#/components/parameters/clientId'
    get:
      operationId: listDispositionSets
      tags: [Clients]
      summary: Disposition form sets, with field and license counts
      description: Pass a set's `id` as `setId` to the disposition form fields endpoint.
      x-safety: read
      x-verified: 2026-11-05
      responses:
        '200':
          description: Sets
          content:
            application/json:
              schema:
                type: object
                required: [sets]
                properties:
                  sets:
                    type: array
                    items: { $ref: '#/components/schemas/DispositionSet' }
  /api/clients/{clientId}/license-seat-compliance:
    parameters:
      - $ref: '#/components/parameters/clientId'
    get:
      operationId: getLicenseSeatCompliance
      tags: [Licenses]
      summary: Whether active licenses are within the contracted seat limit
      x-safety: read
      x-verified: 2026-11-05
      responses:
        '200':
          description: Compliance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatCompliance' }
  /api/clients/{clientId}/license-seat-settings:
    parameters:
      - $ref: '#/components/parameters/clientId'
    get:
      operationId: getLicenseSeatSettings
      tags: [Licenses]
      summary: The grace period allowed when licenses exceed the seat limit
      x-safety: read
      x-verified: 2026-11-05
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                type: object
                required: [seatGracePeriodHours, minHours, maxHours]
                properties:
                  seatGracePeriodHours: { type: integer }
                  seatGraceStartedAt: { type: [string, 'null'] }
                  seatGraceEndsAt: { type: [string, 'null'] }
                  minHours: { type: integer }
                  maxHours: { type: integer }
  /api/clients/{clientId}/callees/{calleeId}:
    parameters:
      - $ref: '#/components/parameters/clientId'
      - name: calleeId
        in: path
        required: true
        description: A `calleeId` from call-contacts, for example `phone-<digits>`.
        schema: { type: string }
    get:
      operationId: getCallee
      tags: [Calls]
      summary: One contact with call stats and every call to or from them
      x-safety: read
      x-verified: 2026-11-05
      responses:
        '200':
          description: Contact
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile: { $ref: '#/components/schemas/Callee' }
  /api/clients/{clientId}/calls/{callId}/ai-insights:
    parameters:
      - $ref: '#/components/parameters/clientId'
      - name: callId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getCallAiInsights
      tags: [Calls]
      summary: A call's AI sentiment, summary and next actions
      description: |
        Reading is free. The portal's POST to the same path generates insights and
        likely spends AI credits, so it isn't in this contract. The sample was
        `queued`, so the shapes of the filled arrays are unknown.
      x-safety: read
      x-verified: 2026-11-05
      responses:
        '200':
          description: Insights
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CallAiInsights' }
components:
  securitySchemes:
    portalSession:
      type: apiKey
      in: cookie
      name: callanchor_portal_session
  parameters:
    clientId:
      name: clientId
      in: path
      required: true
      schema: { type: string }
    clientIdFilter:
      name: clientId
      in: query
      schema: { type: string }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, default: 50 }
  schemas:
    OtpRequest:
      type: object
      required: [identifier, mode]
      properties:
        identifier: { type: string, description: E.164 mobile }
        mode: { type: string, enum: [mobile] }
    OtpSent:
      type: object
      required: [message, otpSentTo, otpChannel]
      properties:
        message: { type: string }
        otpSentTo: { type: string }
        otpChannel: { type: string }
    PortalUser:
      type: object
      required: [kind, name, email, roleId, permissions]
      properties:
        kind: { type: string }
        supportUserId: { type: string }
        portalUserId: { type: string }
        name: { type: string }
        email: { type: string }
        mobile: { type: string }
        profileImageUrl: { type: [string, 'null'] }
        roleId: { type: string }
        permissions:
          type: array
          items: { type: string }
        logAccess:
          type: object
          properties:
            canViewSystemLogs: { type: boolean }
            canViewAuditLogs: { type: boolean }
    PortalProfile:
      type: object
      required: [portalUserId, name, email, mobile]
      properties:
        portalUserId: { type: string }
        name: { type: string }
        email: { type: string }
        mobile: { type: string }
        profileImageUrl: { type: [string, 'null'] }
    Pagination:
      type: object
      required: [page, limit, total, totalPages, hasMore]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
        hasMore: { type: boolean }
    Platform:
      type: object
      required: [id, name, active]
      properties:
        id: { type: string }
        name: { type: string }
        active: { type: boolean }
        connectedAt: { type: string }
    Client:
      type: object
      required: [id, companyName, plan, status, accessSuspended, licenseCount, platforms]
      properties:
        id: { type: string }
        companyName: { type: string }
        contactName: { type: string }
        email: { type: string }
        phone: { type: string }
        plan: { type: string }
        status: { type: string, description: 'Seen: trial' }
        accessSuspended: { type: boolean }
        createdAt: { type: string, description: Date only (YYYY-MM-DD) }
        licenseCount: { type: integer }
        licenseExpiresAt: { type: [string, 'null'] }
        licenseNumbers:
          type: array
          items: { type: string }
        portalAdminMobiles:
          type: array
          items: { type: string }
        numbers:
          type: array
          items: {}
        platforms:
          type: array
          items: { $ref: '#/components/schemas/Platform' }
    ClientMetrics:
      type: object
      required: [clientId, companyName, status, totalCalls, callsToday, failedCallouts24h, totalLicenses, activeIntegrations, syncedRate]
      properties:
        clientId: { type: string }
        companyName: { type: string }
        status: { type: string }
        totalCalls: { type: integer }
        callsToday: { type: integer }
        failedCallouts24h: { type: integer }
        totalLicenses: { type: integer }
        contractRecordedCalls: { type: integer }
        contractPlatformSyncs: { type: integer }
        contractRecordingLimit: { type: [integer, 'null'], description: Null seen live; meaning unconfirmed }
        contractSyncLimit: { type: [integer, 'null'], description: Null seen live; meaning unconfirmed }
        trialRecordedCalls: { type: integer }
        trialPlatformSyncs: { type: integer }
        trialRecordingLimit: { type: [integer, 'null'], description: Null seen live; meaning unconfirmed }
        trialPlatformSyncLimit: { type: [integer, 'null'], description: Null seen live; meaning unconfirmed }
        activeIntegrations: { type: integer }
        syncedRate: { type: number }
    CallRecord:
      type: object
      required: [id, calleeId, calleeName, calleePhone, agent, duration, datetime, datetimeLabel, type]
      properties:
        id: { type: string }
        calleeId: { type: string }
        calleeName: { type: string }
        calleePhone: { type: string }
        agent: { type: string }
        teamMemberId: { type: string }
        duration: { type: string, description: 'mm:ss' }
        durationSeconds: { type: integer }
        datetime: { type: string, format: date-time }
        datetimeLabel: { type: string, description: Display label in IST }
        type: { type: string, description: 'Seen: Incoming, Outgoing' }
        recordingStatus: { type: string }
        platformSyncStatus: { type: string }
        recordingUnavailableReason: { type: [string, 'null'] }
        recordingPermissionDisabledAt: { type: [string, 'null'] }
        anyIntegrationSynced: { type: boolean }
        aiInsightStatus: { type: [string, 'null'] }
        aiInsightErrorCode: { type: [string, 'null'] }
        aiOverallSentiment: { type: [string, 'null'] }
        aiSentimentScore: { type: [number, 'null'] }
        aiCreditsUsed: { type: [number, 'null'] }
        dispositionLabel: { type: [string, 'null'] }
        dispositionNote: { type: [string, 'null'] }
        dispositionScheduledAt: { type: [string, 'null'] }
        dispositionDisplayFields:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              label: { type: string }
              type: { type: string }
              displayValue: { type: [string, 'null'] }
    Fleet:
      type: object
      required: [totalCalls, callsToday, failedCallouts24h, totalLicenses, trialsNearLimit, clientMetrics, callRecords]
