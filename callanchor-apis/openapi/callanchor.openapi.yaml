            agentName: { type: string }
            callType: { type: string }
            durationLabel: { type: string }
            callRecordAvailable: { type: boolean }
        platform:
          type: object
          properties:
            slug: { type: string }
            name: { type: string }
            isCustom: { type: boolean }
