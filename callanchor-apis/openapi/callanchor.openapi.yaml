openapi: 3.1.0
info:
  title: CallAnchor Portal API
  version: 0.1.0
  description: |
    Internal portal API behind app.360callanchor.com. There is no public contract:
    this file is reverse-documented from captured responses and is the source of
    truth for this repo. CallAnchor can change it without notice, so `ca check`
    compares it against production.

    Extensions:
    - `x-safety`: `read`, `sensitive` (a read that issues access to a recording),
      `write` (changes state, needs --confirm) or `auth` (login flow).
    - `x-verified`: `sample` means the shape comes from one sheet sample and has
      not been checked live. Change it to the date of the first passing `ca check`.
servers:
  - url: https://app.360callanchor.com
tags:
  - name: Auth
  - name: Fleet
  - name: Clients
  - name: Calls
  - name: Sync
  - name: Logs
  - name: OneAPI
security:
  - portalSession: []
paths:
  /api/auth/send-otp:
    post:
      operationId: sendOtp
      tags: [Auth]
      summary: Place an OTP call to a portal user
      description: Calls a real phone each time it runs.
      x-safety: auth
      x-verified: sample
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '200':
          description: OTP call placed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpSent' }
  /api/auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [Auth]
      summary: Exchange an OTP for a portal session
      description: Returns the session as a callanchor_portal_session cookie in Set-Cookie.
      x-safety: auth
      x-verified: sample
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/OtpRequest' }
                - type: object
                  required: [otp]
                  properties:
                    otp: { type: string }
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalUser' }
  /api/fleet:
    get:
      operationId: getFleet
      tags: [Fleet]
      summary: Fleet totals and one metrics row per client
      x-safety: read
      x-verified: sample
      responses:
        '200':
          description: Fleet summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fleet' }
  /api/clients:
    get:
      operationId: listClients
      tags: [Clients]
      summary: List all clients
      description: The sheet shows one element, so the list envelope is unconfirmed.
      x-safety: read
      x-verified: sample
      responses:
        '200':
          description: Clients
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/Client' }
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Client' }
  /api/clients/{clientId}:
    parameters:
      - $ref: '#/components/parameters/clientId'
    get:
      operationId: getClient
      tags: [Clients]
      summary: One client
      x-safety: read
      x-verified: sample
      responses:
        '200':
          description: Client
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
  /api/clients/{clientId}/tenant:
    parameters:
      - $ref: '#/components/parameters/clientId'
    get:
      operationId: getClientTenant
      tags: [Clients]
      summary: Everything about one client
      description: |
        Licenses, integrations, settings and quota counters. Heavy (46 KB in the
        sample). `callRecords` and `callAnchorLogs` are truncated previews, so use
        the paginated endpoints for history.
      x-safety: read
      x-verified: sample
      responses:
        '200':
          description: Tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
  /api/clients/{clientId}/integrations:
    parameters:
      - $ref: '#/components/parameters/clientId'
    get:
      operationId: listClientIntegrations
      tags: [Clients]
      summary: Integration configs for a client
      x-safety: read
      x-verified: sample
      responses:
        '200':
          description: Integrations
          content:
            application/json:
              schema:
                type: object
                required: [configs, logs]
                properties:
                  configs:
                    type: array
                    items: { $ref: '#/components/schemas/Integration' }
                  logs:
                    type: array
                    items: { $ref: '#/components/schemas/CalloutEvent' }
  /api/clients/{clientId}/disposition-form-fields:
    parameters:
      - $ref: '#/components/parameters/clientId'
    get:
      operationId: getDispositionFormFields
      tags: [Clients]
      summary: Disposition form for a client
      x-safety: read
      x-verified: sample
      responses:
        '200':
          description: Form fields and presets
          content:
            application/json:
              schema:
                type: object
                required: [fields, presets]
                properties:
                  fields:
                    type: array
                    items: { $ref: '#/components/schemas/DispositionField' }
                  presets:
                    type: array
                    items: { $ref: '#/components/schemas/DispositionPresetRecord' }
  /api/clients/{clientId}/call-contacts:
    parameters:
      - $ref: '#/components/parameters/clientId'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/limit'
    get:
      operationId: listCallContacts
      tags: [Calls]
      summary: Calls grouped by contact, with call stats
      x-safety: read
      x-verified: sample
      x-paginated: true
      responses:
        '200':
          description: Contacts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallContacts' }
  /api/clients/{clientId}/calls/{callId}/recording-link:
    parameters:
      - $ref: '#/components/parameters/clientId'
      - name: callId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getRecordingLink
      tags: [Calls]
      summary: Issue a signed link to a call recording
      description: The link is valid for 5 minutes. Never log or store it.
      x-safety: sensitive
      x-verified: sample
      responses:
        '200':
          description: Signed link
          content:
            application/json:
              schema:
                type: object
                required: [callId, recordingStatus, url, expiresAt]
                properties:
                  callId: { type: string }
                  recordingStatus: { type: string }
                  url: { type: string }
                  expiresAt: { type: string, format: date-time }
  /api/clients/{clientId}/callout-logs:
    parameters:
      - $ref: '#/components/parameters/clientId'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/limit'
    get:
      operationId: listCalloutLogs
      tags: [Sync]
      summary: CRM delivery attempts, with success aggregate
      description: The sample asked for limit=50 and got limit=10, so there may be a server cap.
      x-safety: read
      x-verified: sample
      x-paginated: true
      responses:
        '200':
          description: Delivery attempts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalloutLogs' }
  /api/clients/{clientId}/anchor-logs/{requestId}:
    parameters:
      - $ref: '#/components/parameters/clientId'
      - name: requestId
        in: path
        required: true
        description: The `requestId` of a callout event, not its `id`.
        schema: { type: string }
    get:
      operationId: getAnchorLog
      tags: [Sync]
      summary: One delivery request with its attempts
      x-safety: read
      x-verified: sample
      responses:
        '200':
          description: Request detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnchorLog' }
  /api/clients/{clientId}/oneapi/status:
    parameters:
      - $ref: '#/components/parameters/clientId'
    get:
      operationId: getOneApiStatus
      tags: [OneAPI]
      summary: Billing and licensing link status
      x-safety: read
      x-verified: sample
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OneApiStatus' }
  /api/clients/{clientId}/oneapi/backfill:
    parameters:
      - $ref: '#/components/parameters/clientId'
    post:
      operationId: backfillOneApi
      tags: [OneAPI]
      summary: Refresh a client's OneAPI link and license data
      x-safety: write
      x-verified: sample
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OneApiBackfill' }
  /api/support/logs:
    parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/clientIdFilter'
    get:
      operationId: listSystemLogs
      tags: [Logs]
      summary: System logs, optionally for one client
      x-safety: read
      x-verified: sample
      x-paginated: true
      responses:
        '200':
          description: Logs
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SystemLog' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
  /api/support/audit-logs:
    parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/clientIdFilter'
    get:
      operationId: listAuditLogs
      tags: [Logs]
      summary: Audit logs, optionally for one client
      x-safety: read
      x-verified: sample
      x-paginated: true
      responses:
        '200':
          description: Logs
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
components:
  securitySchemes:
    portalSession:
      type: apiKey
      in: cookie
      name: callanchor_portal_session
  parameters:
    clientId:
      name: clientId
      in: path
      required: true
      schema: { type: string }
    clientIdFilter:
      name: clientId
      in: query
      schema: { type: string }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, default: 50 }
  schemas:
    OtpRequest:
      type: object
      required: [identifier, mode]
      properties:
        identifier: { type: string, description: E.164 mobile }
        mode: { type: string, enum: [mobile] }
    OtpSent:
      type: object
      required: [message, otpSentTo, otpChannel]
      properties:
        message: { type: string }
        otpSentTo: { type: string }
        otpChannel: { type: string }
    PortalUser:
      type: object
      required: [kind, name, email, roleId, permissions]
      properties:
        kind: { type: string }
        supportUserId: { type: string }
        portalUserId: { type: string }
        name: { type: string }
        email: { type: string }
        mobile: { type: string }
        profileImageUrl: { type: [string, 'null'] }
        roleId: { type: string }
        permissions:
          type: array
          items: { type: string }
        logAccess:
          type: object
          properties:
            canViewSystemLogs: { type: boolean }
            canViewAuditLogs: { type: boolean }
    Pagination:
      type: object
      required: [page, limit, total, totalPages, hasMore]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
        hasMore: { type: boolean }
    Platform:
      type: object
      required: [id, name, active]
      properties:
        id: { type: string }
        name: { type: string }
        active: { type: boolean }
        connectedAt: { type: string }
    Client:
      type: object
      required: [id, companyName, plan, status, accessSuspended, licenseCount, platforms]
      properties:
        id: { type: string }
        companyName: { type: string }
        contactName: { type: string }
        email: { type: string }
        phone: { type: string }
        plan: { type: string }
        status: { type: string, description: 'Seen: trial' }
        accessSuspended: { type: boolean }
        createdAt: { type: string, description: Date only (YYYY-MM-DD) }
        licenseCount: { type: integer }
        licenseNumbers:
          type: array
          items: { type: string }
        portalAdminMobiles:
          type: array
          items: { type: string }
        numbers:
          type: array
          items: {}
        platforms:
          type: array
          items: { $ref: '#/components/schemas/Platform' }
    ClientMetrics:
      type: object
      required: [clientId, companyName, status, totalCalls, callsToday, failedCallouts24h, totalLicenses, activeIntegrations, syncedRate]
      properties:
        clientId: { type: string }
        companyName: { type: string }
        status: { type: string }
        totalCalls: { type: integer }
        callsToday: { type: integer }
        failedCallouts24h: { type: integer }
        totalLicenses: { type: integer }
        contractRecordedCalls: { type: integer }
        contractPlatformSyncs: { type: integer }
        contractRecordingLimit: { type: integer }
        contractSyncLimit: { type: integer }
        trialRecordedCalls: { type: integer }
        trialPlatformSyncs: { type: integer }
        trialRecordingLimit: { type: integer }
        trialPlatformSyncLimit: { type: integer }
        activeIntegrations: { type: integer }
        syncedRate: { type: number }
    CallRecord:
      type: object
      required: [id, calleeId, calleeName, calleePhone, agent, duration, datetime, datetimeLabel, type]
      properties:
        id: { type: string }
        calleeId: { type: string }
        calleeName: { type: string }
        calleePhone: { type: string }
        agent: { type: string }
        teamMemberId: { type: string }
        duration: { type: string, description: 'mm:ss' }
        datetime: { type: string, format: date-time }
        datetimeLabel: { type: string, description: Display label in IST }
        type: { type: string, description: 'Seen: Incoming, Outgoing' }
        recordingStatus: { type: string }
        platformSyncStatus: { type: string }
        anyIntegrationSynced: { type: boolean }
        dispositionLabel: { type: [string, 'null'] }
        dispositionNote: { type: [string, 'null'] }
        dispositionScheduledAt: { type: [string, 'null'] }
        dispositionDisplayFields:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              label: { type: string }
              type: { type: string }
              displayValue: { type: [string, 'null'] }
    Fleet:
      type: object
      required: [totalCalls, callsToday, failedCallouts24h, totalLicenses, trialsNearLimit, clientMetrics, callRecords]
      properties:
        totalCalls: { type: integer }
        callsToday: { type: integer }
        failedCallouts24h: { type: integer }
        totalLicenses: { type: integer }
        trialsNearLimit:
          type: array
          items:
            type: object
            required: [clientId, companyName]
            properties:
              clientId: { type: string }
              companyName: { type: string }
        clientMetrics:
          type: array
          items: { $ref: '#/components/schemas/ClientMetrics' }
        callRecords:
          type: array
          items: { $ref: '#/components/schemas/CallRecord' }
    LoginEvent:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: [string, 'null'] }
        at: { type: [string, 'null'] }
        tone: { type: string }
        icon: { type: string }
    License:
      type: object
      required: [id, number, status, isLoggedIn, isActive, lifetimeCallRecordCount]
      properties:
        id: { type: string }
        number: { type: string }
        status: { type: string, description: 'Seen: assigned' }
        assignedTo:
          type: [object, 'null']
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: string }
            role: { type: string }
        assignedAtLabel: { type: [string, 'null'] }
        lastLoginLabel: { type: [string, 'null'] }
        lastLoginDevice: { type: [string, 'null'] }
        lastLoginAndroidBrand: { type: [string, 'null'] }
        lastLoginAndroidModel: { type: [string, 'null'] }
        lastLoginFirmwareVersion: { type: [string, 'null'] }
        lastLoginGoogleDialerPresent: { type: [boolean, 'null'] }
        lastLoginAppVersion: { type: [string, 'null'] }
        lastLoginAppVersionCode: { type: [integer, 'null'] }
        isLoggedIn: { type: boolean }
        isActive: { type: boolean }
        callCapturePolicy: { type: [string, 'null'] }
        recordingEnabled: { type: [boolean, 'null'] }
        allowMobileLogout: { type: [boolean, 'null'] }
        lifetimeCallRecordCount: { type: integer }
        loginHistory:
          type: array
          items: { $ref: '#/components/schemas/LoginEvent' }
    Integration:
      type: object
      required: [platformId, platformName, active, endpoint, authMode, isCustom, scheduler]
      properties:
        platformId: { type: string }
        platformName: { type: string }
        active: { type: boolean }
        endpoint: { type: string }
        authMode: { type: string }
        authFields:
          type: object
          description: Secrets come back blank; see authFieldMasks.
        authFieldMasks:
          type: object
          description: Masked secrets, keyed by field.
        isCustom: { type: boolean }
        scheduler:
          type: object
          properties:
            frequency: { type: string, description: 'Seen: realtime, 1h' }
            enabled: { type: boolean }
        eventTypes:
          type: array
          items: {}
        connectedAt: { type: string }
        lastHealthCheck: { type: string, format: date-time }
    CalloutEvent:
      type: object
      required: [id, requestId, platformId, eventType, callId, attempt, status, at, endpoint]
      properties:
        id: { type: string }
        requestId: { type: string }
        platformId: { type: string }
        eventType: { type: string, description: 'Seen: call.completed, recording.ready' }
        callId: { type: string }
        calleeName: { type: string }
        attempt: { type: integer }
        status: { type: string, description: 'Seen: delivered, failed' }
        httpStatus: { type: [integer, 'null'] }
        durationMs: { type: [integer, 'null'] }
        at: { type: string, format: date-time }
        endpoint: { type: string }
        payloadPreview: { type: string, description: JSON text of the sent payload }
        responsePreview: { type: string, description: JSON text of the CRM's reply }
        errorMessage: { type: string, description: Present on failures }
        externalRecordId: { type: string, description: Present on success }
    DispositionPreset:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        enabled: { type: boolean }
        description: { type: string }
    DispositionPresetRecord:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        label: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        isDefault: { type: boolean }
        sortOrder: { type: integer }
    DispositionField:
      type: object
      required: [id, slug, label, type, required, enabled]
      properties:
        id: { type: string }
        slug: { type: string }
        label: { type: string }
        type: { type: string, description: 'Seen: single_select, textarea, datetime, preset' }
        required: { type: boolean }
        enabled: { type: boolean }
        isDefault: { type: boolean }
        sortOrder: { type: integer }
        config:
          type: [object, 'null']
          description: Options or placeholder, depending on type.
        archivedAt: { type: [string, 'null'] }
        usageCount: { type: integer }
    Tenant:
      type: object
      required: [clientId, callRecords, licenses, integrations, callAnchorLogs, updatedAt]
      properties:
        clientId: { type: string }
        viewerTeamMemberId: { type: [string, 'null'] }
        viewerTeamMemberName: { type: [string, 'null'] }
        callRecords:
          type: array
          items: { $ref: '#/components/schemas/CallRecord' }
        licenses:
          type: array
          items: { $ref: '#/components/schemas/License' }
        integrations:
          type: array
          items: { $ref: '#/components/schemas/Integration' }
        callAnchorLogs:
          type: array
          items: { $ref: '#/components/schemas/CalloutEvent' }
        teamMembers:
          type: array
          items: {}
        dispositionSettings:
          type: object
          properties:
            enabled: { type: boolean }
            required: { type: boolean }
            promptTiming: { type: string }
            allowSkip: { type: boolean }
            skipRequiresReason: { type: boolean }
            reminderIfIncomplete: { type: boolean }
            maxPromptSeconds: { type: integer }
            presetDispositions:
              type: array
              items: { $ref: '#/components/schemas/DispositionPreset' }
        callCaptureSettings:
          type: object
          properties:
            defaultPolicy: { type: string }
            allowLicenseOverride: { type: boolean }
            recordingEnabled: { type: boolean }
        mobileAppSettings:
          type: object
          properties:
            allowMobileLogout: { type: boolean }
            allowLicenseOverride: { type: boolean }
        dataRetentionSettings:
          type: object
          properties:
            preset: { type: string }
            customDays: { type: [integer, 'null'] }
        storageSettings:
          type: object
          properties:
            mode: { type: string }
            clientStatus: { type: string }
            storageChoice: { type: string }
            ownProvider: { type: [string, 'null'] }
            provider: { type: string }
            status: { type: string }
            bucket: { type: string }
            region: { type: string }
            secretIdMasked: { type: string }
            roleArnMasked: { type: string }
            externalIdMasked: { type: string }
            kmsKeyId: { type: string }
            lastValidatedAt: { type: [string, 'null'] }
            lastError: { type: [string, 'null'] }
            migrationQueued: { type: integer }
            migrationDone: { type: integer }
            migrationFailed: { type: integer }
            callAnchorAccountId: { type: string }
        trialRecordedCalls: { type: integer }
        trialPendingRecordings: { type: integer }
        trialRecordingLimit: { type: integer }
        trialPlatformSyncs: { type: integer }
        trialPlatformSyncLimit: { type: integer }
        trialRecordingAtLimit: { type: boolean }
        trialExpiresAt: { type: [string, 'null'] }
        trialDaysRemaining: { type: [integer, 'null'] }
        trialExpired: { type: boolean }
        contractRecordedCalls: { type: integer }
        contractPendingRecordings: { type: integer }
        contractRecordingLimit: { type: integer }
        contractRecordingUnlimited: { type: boolean }
        contractPlatformSyncs: { type: integer }
        contractSyncLimit: { type: integer }
        contractSyncUnlimited: { type: boolean }
        contractRecordingAtLimit: { type: boolean }
        contractLicenseCount: { type: integer }
        contractLicenseActiveCount: { type: integer }
        contractLicenseLimit: { type: integer }
        contractLicenseUnlimited: { type: boolean }
        contractLicenseAtLimit: { type: boolean }
        contractLicenseOverCap: { type: boolean }
        contractLicenseActivationLocked: { type: boolean }
        contractLicenseOverBy: { type: integer }
        contractSeatCompliancePhase: { type: string }
        contractSeatGraceEndsAt: { type: [string, 'null'] }
        contractSeatGracePeriodHours: { type: integer }
        contractIntegrationCount: { type: integer }
        contractIntegrationLimit: { type: integer }
        contractIntegrationUnlimited: { type: boolean }
        contractIntegrationAtLimit: { type: boolean }
        trialRecordingRetentionHeld: { type: boolean }
        trialRecordingDeletionDueAt: { type: [string, 'null'] }
        trialRecordingAccessRevoked: { type: boolean }
        updatedAt: { type: string, format: date-time }
    CallContacts:
      type: object
      required: [items, pagination, stats, agents]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              calleeId: { type: string }
              calleeName: { type: string }
              calleePhone: { type: string }
              callCount: { type: integer }
              lastAgent: { type: string }
              lastDuration: { type: string }
              lastDatetimeLabel: { type: string }
              lastDatetime: { type: string, format: date-time }
              typesPresent:
                type: array
                items: { type: string }
        pagination: { $ref: '#/components/schemas/Pagination' }
        stats:
          type: object
          required: [totalCalls, uniqueContacts, incoming, outgoing, missed, rejected]
          properties:
            totalCalls: { type: integer }
            uniqueContacts: { type: integer }
            incoming: { type: integer }
            outgoing: { type: integer }
            missed: { type: integer }
            rejected: { type: integer }
            answerRate: { type: number }
            missedRate: { type: number }
            rejectedRate: { type: number }
