            dispositionScheduledAt: { type: [string, 'null'] }
        disposition:
          type: object
          properties:
            submittedAt: { type: string, format: date-time }
            fields:
              type: object
              description: Client-specific, keyed by form field slug.
    AnchorLog:
      type: object
      required: [request, events, call, platform]
