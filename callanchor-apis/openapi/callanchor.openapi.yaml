    CallPayload:
      type: object
      description: The body CallAnchor sends to the CRM.
      required: [event, hasRecording, call]
      properties:
        event: { type: string }
        hasRecording: { type: boolean }
        call:
          type: object
          properties:
            id: { type: string }
            callType: { type: string }
            agentName: { type: string }
            agentNumber: { type: string }
