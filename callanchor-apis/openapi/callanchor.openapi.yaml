          type: array
          items: { type: string }
    CalloutLogs:
      type: object
      required: [items, pagination, aggregate]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CalloutEvent' }
        pagination: { $ref: '#/components/schemas/Pagination' }
        aggregate:
          type: object
          required: [total, delivered, failed, retrying, queued, successRate]
          properties:
            total: { type: integer }
            delivered: { type: integer }
            failed: { type: integer }
            retrying: { type: integer }
            queued: { type: integer }
            successRate: { type: number }
